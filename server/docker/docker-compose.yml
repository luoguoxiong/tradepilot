# TradePilot 后端本地开发环境（后端技术方案 09 §1/§3）
# 用法：在 server/ 目录执行 `pnpm docker:up`
name: tradepilot-dev

services:
  postgres:
    # pgvector 官方镜像（基于 postgres:16，含 contrib 扩展 pg_trgm）
    image: pgvector/pgvector:pg16
    container_name: tradepilot-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradepilot_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tradepilot}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tradepilot} -d ${POSTGRES_DB:-tradepilot}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tradepilot-redis
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: tradepilot-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tradepilot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tradepilot_dev}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # SMTP/IMAP 测试邮件服务（M4 三图 dry-run 收发闭环联调用）：SMTP 1025 / IMAP 1114 / Web UI 8025
    # GreenMail（原 mailpit 无 IMAP 服务，收信链路 EmailSyncProcessor 需真实 IMAP）：
    # 任意收件人自动建箱、任意凭据登录；收件地址即邮箱用户名（如 sales@tradepilot.local）
    image: greenmail/standalone:2.1.3
    container_name: tradepilot-mailpit
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:3025'
      - '${MAILPIT_IMAP_PORT:-1114}:3143'
      - '${MAILPIT_UI_PORT:-8025}:8080'

volumes:
  pg_data:
  redis_data:
  minio_data:
